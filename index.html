<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงเวลาพนักงานด้วย QR Code + ถ่ายรูปสด</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 14px; color: #555; display: block; margin-bottom: 5px; }
        
        /* สไตล์ปุ่มเปิดกล้องให้กดง่ายและดูทันสมัย */
        .camera-btn-container {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .camera-btn {
            background-color: #008CBA;
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 15px;
            cursor: pointer;
            display: block;
            transition: background 0.3s;
        }
        .camera-btn:hover { background-color: #007399; }
        
        /* ซ่อน input file แบบเดิม แต่ครอบด้วยปุ่มสวยๆ */
        input[type="file"] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #45a049; }
        .result {
            margin-top: 20px;
            text-align: left;
            font-size: 14px;
            color: #555;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        #previewContainer {
            margin-top: 10px;
            display: none;
            text-align: center;
        }
        #imagePreview {
            max-width: 100%;
            max-height: 180px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ลงเวลาทำงาน</h2>
    <p>กรอกรหัส ถ่ายรูปสด และบันทึกพิกัด</p>
    
    <div class="form-group">
        <label>รหัสพนักงานหรือชื่อ:</label>
        <input type="text" id="employeeId" placeholder="เช่น EMP001 หรือ สมชาย">
    </div>

    <div class="form-group">
        <label>ถ่ายภาพยืนยันตัวตน (จากกล้องเท่านั้น):</label>
        <div class="camera-btn-container">
            <div class="camera-btn" id="btnLabel">📷 เปิดกล้องถ่ายรูป</div>
            <!-- capture="user" บังคับกล้องหน้า / เปลี่ยนเป็น "environment" หากต้องการบังคับกล้องหลัง -->
            <input type="file" id="photoInput" accept="image/*" capture="user" onchange="previewPhoto(event)">
        </div>
    </div>

    <div id="previewContainer">
        <img id="imagePreview" alt="Preview">
        <p style="font-size: 12px; color: #888; margin-top: 5px;">ภาพถ่ายพร้อมส่งยืนยัน</p>
    </div>

    <button class="btn" onclick="checkIn()" style="margin-top: 10px;">บันทึกเวลาลงงาน</button>

    <div id="resultBox" class="result">
        <p><strong>สถานะ:</strong> <span id="statusText">กำลังดำเนินการ...</span></p>
        <p><strong>เวลา:</strong> <span id="timeText">-</span></p>
        <p><strong>พิกัด:</strong> <span id="geoText">-</span></p>
    </div>
</div>

<script>
let base64Image = "";

function previewPhoto(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            base64Image = e.target.result;
            document.getElementById('imagePreview').src = base64Image;
            document.getElementById('previewContainer').style.display = 'block';
            document.getElementById('btnLabel').innerText = "🔄 ถ่ายรูปใหม่อีกครั้ง";
            document.getElementById('btnLabel').style.backgroundColor = "#ff9800";
        }
        reader.readAsDataURL(file);
    }
}

function checkIn() {
    const empId = document.getElementById('employeeId').value;
    if (!empId) {
        alert('กรุณากรอกรหัสพนักงานหรือชื่อก่อนลงเวลา');
        return;
    }
    if (!base64Image) {
        alert('กรุณาถ่ายรูปยืนยันจากกล้องก่อนบันทึกเวลา');
        return;
    }

    const resultBox = document.getElementById('resultBox');
    const statusText = document.getElementById('statusText');
    const timeText = document.getElementById('timeText');
    const geoText = document.getElementById('geoText');

    resultBox.style.display = 'block';
    statusText.innerText = 'กำลังดึงพิกัด GPS...';

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const currentTime = new Date().toLocaleString('th-TH');

                timeText.innerText = currentTime;
                geoText.innerText = `${lat}, ${lng}`;
                statusText.innerText = 'กำลังอัปโหลดข้อมูลและรูปภาพ...';
                statusText.style.color = '#4CAF50';

                sendDataToDatabase(empId, currentTime, lat, lng, base64Image, statusText);
            },
            (error) => {
                statusText.innerText = 'ไม่สามารถดึงพิกัดได้ (โปรดเปิด GPS)';
                statusText.style.color = '#d9534f';
                console.error(error);
            },
            { enableHighAccuracy: true }
        );
    } else {
        statusText.innerText = 'เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง';
        statusText.style.color = '#d9534f';
    }
}

function sendDataToDatabase(empId, time, lat, lng, imageStr, statusText) {
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxJDYiPgMGnm0pKtkNtLHlnLB37MxD6axAw1tSfv7sgqv1aPp5tKftSc-tIDQkRx3Jbvg/exec'; // <--- ใส่ลิงก์ Web App ของคุณ
    
    fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ empId, time, lat, lng, image: imageStr })
    })
    .then(() => {
        statusText.innerText = 'บันทึกสำเร็จ!';
        alert('บันทึกเวลาและส่งรูปถ่ายสำเร็จเรียบร้อย!');
    })
    .catch((error) => {
        console.error('Error!', error);
        statusText.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
        statusText.style.color = '#d9534f';
    });
}
</script>

</body>
</html>
